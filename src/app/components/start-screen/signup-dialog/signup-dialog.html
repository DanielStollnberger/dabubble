<h3 mat-dialog-title>Create Account</h3>

<mat-dialog-content>

  <mat-form-field appearance="outline" style="margin-top: 20px;">
    <mat-label>Email</mat-label>
    <input matInput type="email" email [(ngModel)]="email" name="email" #emailInput="ngModel" placeholder="Enter your email" required>
  </mat-form-field>

  <mat-form-field appearance="outline">
    <mat-label>Password</mat-label>
    <input matInput type="password" [(ngModel)]="password" name="password" placeholder="Enter your password" required>
  </mat-form-field>

  <mat-form-field appearance="outline">
    <mat-label>Username</mat-label>
    <input matInput [(ngModel)]="name" name="name" placeholder="Your name">
  </mat-form-field>

  <mat-form-field appearance="outline">
    <mat-label>Choose your Profile</mat-label>

    <mat-select [(ngModel)]="avatar">
      @for (pb of profilePictures; track pb) {
      <mat-option [value]="pb">
        <img [src]="pb" style="height: 80px;">
      </mat-option>
      }
    </mat-select>
  </mat-form-field>

  <div style="margin-top: 10px;">
    <img [src]="avatar" style="width: 150px; border-radius: 50%;">
  </div>

</mat-dialog-content>

<mat-dialog-actions>
  <button mat-button mat-dialog-close>
    Cancel
  </button>

  <button mat-flat-button color="primary" (click)="signUp()" mat-dialog-close [disabled]="emailInput.invalid || !password">
    Sign Up
  </button>
</mat-dialog-actions>
