<h2 mat-dialog-title>Server Info</h2>

<mat-dialog-content>

    <span class="label">Servername:</span>

  </div>

  <div class="info-row">
    <span class="label">Server created from:</span>
    <span class="value">Daniel</span>
  </div>

  <div class="info-row">
    <span class="label">Server created at:</span>
    <span class="value">13.03.2026</span>
  </div>

  <div class="info-row">
    <span class="label">Server-ID:</span>
    <span class="value">120.0020.120</span>
  </div>

<mat-dialog-actions align="end">
